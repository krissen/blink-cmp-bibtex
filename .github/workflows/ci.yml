name: CI

on:
  push:
    branches: [master, development]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.nvim }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        nvim: [v0.10.4, stable, nightly]
    continue-on-error: ${{ matrix.nvim == 'nightly' }}
    steps:
      - uses: actions/checkout@v4

      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.nvim }}

      # The test harness installs luassert through hererocks, which needs Python.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - uses: actions/cache@v4
        with:
          path: .tests
          # The workflow file is part of the key so that changes to the
          # toolchain setup below do not restore a sandbox built without it.
          key: ${{ runner.os }}-tests-${{ matrix.nvim }}-${{ hashFiles('tests/minit.lua', '.github/workflows/ci.yml') }}

      # hererocks builds Lua 5.1 from source, which links against readline.
      - name: Install readline headers
        run: sudo apt-get update && sudo apt-get install -y libreadline-dev

      - name: Run the test suite
        run: nvim -l tests/minit.lua --minitest
        timeout-minutes: 10

  quality:
    name: quality gates (prek)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # fetch-depth: 0 (full history): the gitleaks scan below needs to
      # diff a commit range, which a shallow (depth-1) checkout can't
      # resolve on a pull_request event (verified: "ambiguous argument"
      # against the base..head range on a shallow clone).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The luacheck hook below runs with `language: system` (see
      # .pre-commit-config.yaml for why prek's own `language: lua` hook is
      # unusable here), so luacheck must exist on PATH before prek runs.
      - uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: '5.1'

      - uses: leafo/gh-actions-luarocks@v6

      - name: Install luacheck
        run: luarocks install luacheck

      - name: Cache prek hook environments
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/prek
          # No Python/Node version in the key: nothing here is installed
          # via setup-python/setup-node, so there is no pinned interpreter
          # version to key against (design.md §4 / Copilot finding, traning).
          # lua5.1 is a real qualifier: the luacheck hook above binds to
          # whatever LuaRocks environment leafo/gh-actions-lua just set up.
          key: prek-${{ runner.os }}-lua5.1-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Quality gates (prek)
        env:
          PREK_HOME: ${{ runner.temp }}/prek
        run: pipx run --spec prek==0.5.2 prek run --all-files --show-diff-on-failure

      # The gitleaks pre-commit hook above only scans the *staged* diff,
      # which is empty in CI (no `git add` happens here) and would
      # otherwise silently report zero findings. `gitleaks/gitleaks-action`
      # is NOT a whole-tree substitute for that: on a `pull_request` event
      # it runs `gitleaks detect` over the base..head commit range (see
      # this job's own earlier logs: `--log-opts=--no-merges --first-parent
      # <base>..<head>`), not `gitleaks dir .` -- a secret already present
      # outside that range goes undetected (Codex finding, PR #39). Install
      # the same pinned gitleaks the pre-commit hook uses and run `dir .`
      # directly instead, verified against the release's own checksums
      # file before executing an unreviewed downloaded binary.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --ignore-missing -c "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: Scan whole tree for secrets
        run: gitleaks dir . --no-banner
