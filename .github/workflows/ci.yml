name: CI

on:
  push:
    branches: [master, development]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.nvim }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nvim: [v0.10.4, stable, nightly]
    continue-on-error: ${{ matrix.nvim == 'nightly' }}
    steps:
      - uses: actions/checkout@v4

      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.nvim }}

      # The test harness installs luassert through hererocks, which needs Python.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - uses: actions/cache@v4
        with:
          path: .tests
          key: ${{ runner.os }}-tests-${{ matrix.nvim }}-${{ hashFiles('tests/minit.lua') }}
          restore-keys: |
            ${{ runner.os }}-tests-${{ matrix.nvim }}-

      # hererocks builds Lua 5.1 from source, which links against readline.
      - name: Install readline headers
        run: sudo apt-get update && sudo apt-get install -y libreadline-dev

      - name: Run the test suite
        run: nvim -l tests/minit.lua --minitest
        timeout-minutes: 10

  lint:
    name: luacheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: '5.1'

      - uses: leafo/gh-actions-luarocks@v6

      - name: Install luacheck
        run: luarocks install luacheck

      - name: Run luacheck
        run: luacheck lua/ tests/ repro.lua

  format:
    name: stylua
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check lua/ tests/ repro.lua
